<style>

*{
margin:0;
padding:0;

body{

nav{

.logo h2{

.hero{
height:45vh;

align-items:center;
text-align:center;

.hero h1{
font-family:'Playfair Display',serif;

}

.section{
padding:80px 8%;
}

.gallery-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

}

.gallery-item{
overflow:hidden;
border-radius:15px;
background:white;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.gallery-item img{
width:100%;
height:280px;
object-fit:cover;
transition:.4s;
cursor:pointer;
}

.gallery-item img:hover{
transform:scale(1.05);
}

footer{
background:#1E1E1E;
color:white;
text-align:center;
padding:30px;
margin-top:50px;
}

@media(max-width:768px){

.hero h1{

.nav-links{
